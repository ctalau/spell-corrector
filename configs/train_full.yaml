seed: 1337
model: configs/model_87m.yaml

data:
  train: data/processed/train.parquet
  validation: data/processed/validation.parquet

training:
  dtype: bf16
  epochs: 2
  optimizer: adamw
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.10
  warmup_ratio: 0.03
  min_lr_ratio: 0.05
  # Auxiliary masked-byte objective (see spelling_reranker/model.py).
  mlm_weight: 0.20
  mlm_probability: 0.12
  mlm_decay_frac: 0.60
  scheduler: cosine
  max_grad_norm: 1.0
  effective_batch_size: 512
  # 256 OOMed on a 44.5GB L40S at step 18: length bucketing means most batches
  # are short, so the peak only arrives when a max-length batch does. 128 halves
  # activation memory to ~21GB while keeping the effective batch at 512.
  microbatch: 128
  grad_accumulation: 4
  num_workers: 16
  pin_memory: true
  compile: false
  length_bucketing: true
  bucket_window_batches: 64
  log_every: 20
  eval_every: 500
  max_steps: null

output:
  dir: artifacts
  metrics_jsonl: artifacts/train_metrics.jsonl
  summary_json: artifacts/train_summary.json
  model_dir: artifacts/model
