seed: 1337
model: configs/model_28m.yaml

data:
  train: data/processed/train.parquet
  validation: data/processed/validation.parquet
  max_train_examples: 4000
  max_val_examples: 1000

training:
  dtype: bf16
  epochs: 1
  optimizer: adamw
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.10
  warmup_ratio: 0.05
  min_lr_ratio: 0.05
  # Auxiliary masked-byte objective (see spelling_reranker/model.py).
  mlm_weight: 0.20
  mlm_probability: 0.12
  mlm_decay_frac: 0.60
  scheduler: cosine
  max_grad_norm: 1.0
  effective_batch_size: 256
  microbatch: 32
  grad_accumulation: 8
  num_workers: 2
  pin_memory: true
  compile: false
  length_bucketing: true
  bucket_window_batches: 16
  log_every: 5
  eval_every: 50
  max_steps: 100

output:
  dir: artifacts
  metrics_jsonl: artifacts/train_metrics.jsonl
  summary_json: artifacts/train_summary.json
  model_dir: artifacts/model
