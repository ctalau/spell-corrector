[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spelling-reranker"
version = "0.1.0"
description = "Tiny ~28M byte-level contextual spelling reranker for Hunspell top-10 suggestions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ctalau" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "pandas>=2.1",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "requests>=2.31",
    "hunspell>=0.5.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["spelling_reranker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
