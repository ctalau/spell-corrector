[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spelling-reranker"
version = "0.1.0"
description = "Tiny ~28M byte-level contextual spelling reranker for Hunspell top-10 suggestions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ctalau" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "pandas>=2.1",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "requests>=2.31",
    "hunspell>=0.5.5",
    "transformers>=4.48,<5",
    "tokenizers",
    "huggingface_hub",
    "accelerate",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
# scripts/llm_judge_bea60k_cpu.py only -- not needed for the trained reranker.
# Needs transformers >=5 for Qwen3.5/Gemma-4's AutoModelForMultimodalLM class,
# which exceeds the core `transformers>=4.48,<5` pin above (that pin is for
# scripts/llm_judge_bea60k.py's GPU track, validated on transformers 4.x/early
# 5.x with a pinned torch/cudnn combination this CPU track does not share).
llm-judge-cpu = ["transformers>=4.57", "accelerate>=0.34"]
# scripts/dspy_prompt_search.py only. `dspy` is the current distribution name;
# the older `dspy-ai` name is a legacy alias and must not be installed instead.
# DSPy talks to llama-server over its OpenAI-compatible endpoint through
# LiteLLM, so no torch/transformers is needed on top of the core deps.
dspy = ["dspy>=3.0"]

[tool.setuptools.packages.find]
include = ["spelling_reranker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: HF ModernBERT download, CUDA extract, or long training — excluded on the frozen Runpod gate",
]
